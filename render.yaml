services:
  - type: web
    name: api-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./apps/api-server/dist/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        value: UC77kf2jXTQvRl2vV3CI8oRA
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: ESEWA_PRODUCT_CODE
        sync: false
      - key: ESEWA_ENV
        value: production
      - key: ESEWA_MONTHLY_PRICE
        sync: false
      - key: ESEWA_YEARLY_PRICE
        sync: false
      - key: STORAGE_BASE_URL
        sync: false
      - key: LOG_LEVEL
        value: info
